[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill 1.0.3 is unmaintained; it arrives through heapless 0.7, postcard and pagable under starlark 0.14.2, which octopus-execpolicy uses; no starlark release drops it" },
    { id = "RUSTSEC-2024-0388", reason = "derivative 2.2.0 is an unmaintained proc-macro used by starlark and starlark_syntax 0.14.2 under octopus-execpolicy; no starlark release drops it" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained proc-macro used by starlark 0.14.2 under octopus-execpolicy and by v8 under octopus-code-mode-engine; neither has a release without it" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash 0.2.1 is unmaintained and arrives through starlark_map under starlark 0.14.2 used by octopus-execpolicy; no starlark release drops it" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml 0.1.10 is unmaintained and arrives through i18n-config under age, used by octopus-secrets; age 0.12.1 still depends on it and no patched release exists" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 2.0.1 is an unmaintained compile-time proc-macro dependency of i18n-embed-fl 0.9 under age 0.11.3 in octopus-secrets; remove when octopus-secrets moves to age 0.12.1, as upstream Codex rust-v0.166.0 did" },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy, the same pin upstream Codex rust-v0.166.0 keeps; only the std, tokio and futures-io features are enabled, so the DNSSEC NSEC3 validation path is not compiled; remove when rama moves to hickory 0.26.1" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy, the same pin upstream Codex rust-v0.166.0 keeps; no rama release on hickory 0.26.1 exists; remove when rama moves to it" },
    { id = "RUSTSEC-2026-0487", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy; no rama release on hickory 0.26.2 exists; the panic is in parsing SVCB or HTTPS records from zone-file text, and the proxy only resolves names, it never parses zone files; remove when rama moves to it" },
    { id = "RUSTSEC-2026-0489", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy; no rama release on hickory 0.26.2 exists; the panic is in parsing SVCB or HTTPS parameter values from zone-file text, which the proxy never does; remove when rama moves to it" },
    { id = "RUSTSEC-2026-0490", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy; no rama release on hickory 0.26.2 exists; the panic is in the zone-file lexer, which the proxy never runs; remove when rama moves to it" },
    { id = "RUSTSEC-2026-0491", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy; no rama release on hickory 0.26.2 exists; the over-reservation is bounded per decoded answer from the system's configured resolver and released when decoding fails; remove when rama moves to it" },
    { id = "RUSTSEC-2026-0504", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy, the same pin upstream Codex rust-v0.166.0 keeps; only the std, tokio and futures-io features are enabled, so the dnssec module and its NSEC3 validation path are not compiled; remove when octopus-network-proxy moves off rama 0.3.0-alpha.4 onto hickory 0.26.2" },
    { id = "RUSTSEC-2026-0505", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy, the same pin upstream Codex rust-v0.166.0 keeps; only the std, tokio and futures-io features are enabled, so the dnssec module and its NSEC3 owner-name validation path are not compiled; remove when octopus-network-proxy moves off rama 0.3.0-alpha.4 onto hickory 0.26.2" },
    { id = "RUSTSEC-2026-0511", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy, the same pin upstream Codex rust-v0.166.0 keeps; only the std, tokio and futures-io features are enabled, so the dnssec module and its NSEC validation path are not compiled; remove when octopus-network-proxy moves off rama 0.3.0-alpha.4 onto hickory 0.26.2" },
    { id = "RUSTSEC-2026-0512", reason = "hickory-proto 0.25.2 arrives through hickory-resolver under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy, the same pin upstream Codex rust-v0.166.0 keeps; only the std, tokio and futures-io features are enabled, so the dnssec module and its RRset validation path are not compiled; remove when octopus-network-proxy moves off rama 0.3.0-alpha.4 onto hickory 0.26.2" },
    { id = "RUSTSEC-2026-0514", reason = "hickory-resolver 0.25.2 arrives under rama-dns and rama-tcp =0.3.0-alpha.4 in octopus-network-proxy, the same pin upstream Codex rust-v0.166.0 keeps; only the tokio and system-config features are enabled, so __dnssec is off and DNSSEC validation in Resolver::lookup and lookup_ip is neither compiled nor enabled; remove when octopus-network-proxy moves off rama 0.3.0-alpha.4 onto hickory 0.26.2" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.0 is unmaintained and arrives only through the futures feature of loom 0.7.2, a cfg(loom) dependency of tokio-graceful 0.2.2 under rama-core =0.3.0-alpha.4 in octopus-network-proxy; cfg(loom) is never set, so it is not compiled into shipped binaries, and no loom or tokio-graceful release drops it" },
