[package]
name = "octopus-tui"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version = "1.85"
autobins = false

[[bin]]
name = "octopus-tui"
path = "src/main.rs"

[[bin]]
name = "md-events"
path = "src/bin/md-events.rs"

[lib]
name = "octopus_tui"
path = "src/lib.rs"
doctest = false

[features]
default = []

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6.3"
crossterm = { version = "0.28.1", features = ["bracketed-paste", "event-stream"] }
derive_more = { version = "2", features = ["is_variant"] }
diffy = "0.4.2"
dirs = "6"
dunce = "1.0.4"
image = { version = "^0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
itertools = "0.14.0"
lazy_static = "1"
pathdiff = "0.2"
pulldown-cmark = "0.10"
rand = "0.9"
ratatui = { version = "0.29.0", features = [
    "scrolling-regions",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
ratatui-macros = "0.6.0"
regex-lite = "0.1.8"
reqwest = { version = "0.12", features = ["cookies", "blocking", "json"] }
rmcp = { version = "1.7.0", default-features = false }
schemars = "0.8.22"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
shlex = "1.3.0"
strum = "0.27.2"
strum_macros = "0.28.0"
supports-color = "3.0.2"
tempfile = "3.23.0"
textwrap = "0.16.2"
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "test-util",
    "time",
] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
toml = "0.9.5"
toml_edit = "0.24.0"
tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
syntect = "5"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"
urlencoding = "2.1"
webbrowser = "1.0"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio-util = { workspace = true, features = ["time"] }

octopus-ansi-escape = { path = "../octopus-ansi-escape" }
octopus-world-terminal-render = { path = "../octopus-world-terminal-render" }
octopus-world-terminal-client = { path = "../octopus-world-terminal-client" }
octopus-world-terminal-support = { path = "../octopus-world-terminal-support" }
octopus-world-terminal-keymap = { path = "../octopus-world-terminal-keymap" }
octopus-world-terminal-config = { path = "../octopus-world-terminal-config" }
octopus-app-server-interface = { path = "../../../world_operator_chat/packages/octopus-app-server-interface" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-runtime = { path = "../../../../../crates/octopus-runtime" }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-marks = { path = "../../../../../crates/octopus-marks" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-ee = { path = "../../../../../crates/octopus-ee" }
octopus-exec = { package = "octopus-exec-substrate", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-exec-substrate" }
octopus-file-search = { package = "octopus-file-search", path = "../../../../../registry/worker_environment_kind/filesystem_workspace/packages/octopus-file-search" }
octopus-git-utils = { package = "octopus-git-utils", path = "../octopus-git-utils" }
octopus-ledger-store = { path = "../../../../../crates/octopus-ledger-store" }
octopus-sandbox = { package = "octopus-sandbox-substrate", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-sandbox-substrate" }
octopus-shell-command = { package = "octopus-shell-command", path = "../octopus-shell-command" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
octopus-util-pathuri = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-pathuri" }

octopus-terminal-detection = { path = "../octopus-terminal-detection" }
octopus-utils-cli = { package = "octopus-utils-cli", path = "../../../../../registry/interface/world_terminal/packages/octopus-utils-cli" }
octopus-utils-elapsed = { path = "../octopus-utils-elapsed" }
octopus-utils-fuzzy-match = { path = "../octopus-utils-fuzzy-match" }
octopus-utils-home-dir = { package = "octopus-utils-home-dir", path = "../../../../../registry/interface/world_terminal/packages/octopus-utils-home-dir" }
octopus-utils-path = { path = "../octopus-utils-path" }
octopus-substrate-contract = { package = "octopus-substrate-contract", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-substrate-contract" }
octopus-utils-sleep-inhibitor = { path = "../octopus-utils-sleep-inhibitor" }


[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
which = "8"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
winsplit = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
assert_matches = "1.5"
async-trait.workspace = true
chrono = { version = "0.4.43", features = ["serde"] }
insta = "1"
pretty_assertions = "1"
rand = "0.9"
serial_test = "3"
vt100 = "0.15.2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
wiremock = "0.6"
octopus-world-terminal-render = { path = "../octopus-world-terminal-render", features = ["test-support"] }
