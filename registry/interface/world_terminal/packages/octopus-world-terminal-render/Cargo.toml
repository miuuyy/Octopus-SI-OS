[package]
name = "octopus-world-terminal-render"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_world_terminal_render"
path = "src/lib.rs"
doctest = false

[features]
default = []
test-support = ["dep:vt100"]

[dependencies]
ratatui = { version = "0.29.0", features = [
    "scrolling-regions",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
crossterm = { version = "0.28.1", features = ["bracketed-paste", "event-stream"] }
derive_more = { version = "2", features = ["is_variant"] }
diffy = "0.4.2"
dirs = "6"
itertools = "0.14.0"
pathdiff = "0.2"
pulldown-cmark = "0.10"
regex-lite = "0.1.8"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = "1.3.0"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
sys-locale = "0.3.2"
supports-color = "3.0.2"
syntect = "5"
textwrap = "0.16.2"
tracing = { version = "0.1.44", features = ["log"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"
urlencoding = "2.1"

octopus-git-utils = { package = "octopus-git-utils", path = "../octopus-git-utils" }
octopus-shell-command = { package = "octopus-shell-command", path = "../octopus-shell-command" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
vt100 = { version = "0.15.2", optional = true }
octopus-terminal-detection = { path = "../octopus-terminal-detection" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
insta = "1"
pretty_assertions = "1"
tempfile = "3.23.0"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
octopus-world-terminal-render = { path = ".", features = ["test-support"] }
vt100 = "0.15.2"
