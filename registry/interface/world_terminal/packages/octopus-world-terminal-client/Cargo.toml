[package]
name = "octopus-world-terminal-client"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_world_terminal_client"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true
tracing = { version = "0.1.44", features = ["log"] }
tokio = { workspace = true, features = ["sync", "net", "io-util", "rt", "time"] }
tokio-util = { workspace = true }
notify.workspace = true
tokio-tungstenite = { version = "0.28.0", features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
uuid = { version = "1", features = ["v4"] }

octopus-world-terminal-render = { path = "../octopus-world-terminal-render" }
ratatui = { version = "0.29.0", features = [
    "scrolling-regions",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }

octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-world-pyecho-life-runtime = { path = "../../../world_pyecho/packages/octopus-world-pyecho-life-runtime" }
octopus-interface-activation-app-server-transport = { path = "../../../world_operator_chat/packages/octopus-interface-activation-app-server-transport" }
octopus-runtime = { path = "../../../../../crates/octopus-runtime" }
octopus-run-record = { path = "../../../../../crates/octopus-run-record" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-ledger-store = { path = "../../../../../crates/octopus-ledger-store" }
octopus-ee = { path = "../../../../../crates/octopus-ee" }
octopus-policy = { path = "../../../../../crates/octopus-policy" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }
octopus-app-server-interface = { path = "../../../world_operator_chat/packages/octopus-app-server-interface" }

[dev-dependencies]
tempfile = "3.23.0"
