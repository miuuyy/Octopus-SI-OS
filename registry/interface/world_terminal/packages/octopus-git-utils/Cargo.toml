[package]
name = "octopus-git-utils"
edition = "2024"
rust-version = "1.85"
version.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
chrono = "0.4.43"
octopus-file-system = { path = "../../../../worker_environment_kind/process_session/packages/octopus-file-system" }
octopus-substrate-contract = { path = "../../../../worker_environment_kind/process_session/packages/octopus-substrate-contract" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
octopus-util-pathuri = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-pathuri" }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
gix = { version = "0.81.0", default-features = false, features = ["sha1"] }
once_cell = "1.20.2"
regex = "1.12.3"
schemars = "0.8.22"
serde = { workspace = true, features = ["derive"] }
similar = "2.7.0"
tempfile = "3.23.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "time"] }
ts-rs = { version = "11", features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lib]
doctest = false
