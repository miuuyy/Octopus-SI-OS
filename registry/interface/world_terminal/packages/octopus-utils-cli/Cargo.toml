[package]
name = "octopus-utils-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
# BOX depends on BOX: the shared CLI arg vocabulary (approvals posture, sandbox
# mode, profile-layer name) comes from the substrate contract, never from the
# provider registry.
octopus-substrate-contract = { package = "octopus-substrate-contract", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-substrate-contract" }
octopus-shell-command = { package = "octopus-shell-command", path = "../octopus-shell-command" }
serde.workspace = true
toml = "0.9.5"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lib]
doctest = false
