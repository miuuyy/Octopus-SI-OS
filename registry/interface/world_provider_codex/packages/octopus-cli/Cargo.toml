[package]
name = "octopus-cli"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"
build = "build.rs"

[[bin]]
name = "octopus-cli"
path = "src/main.rs"

[lib]
name = "octopus_cli"
path = "src/lib.rs"
doctest = false

[features]
default = []

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
owo-colors = "4.3.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
supports-color = "3.0.2"
thiserror.workspace = true
toml = "0.9.5"
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml_edit = "0.24.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = "2"

octopus-arg0 = { path = "../octopus-arg0" }
octopus-execpolicy = { package = "octopus-execpolicy", path = "../octopus-execpolicy" }
octopus-substrate-contract = { package = "octopus-substrate-contract", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-substrate-contract" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }

octopus-codex-cli = { path = "../octopus-codex-cli" }
octopus-app-server-transport = { path = "../octopus-app-server-transport" }
octopus-appserver-proto = { path = "../octopus-appserver-proto" }
octopus-chatgpt = { path = "../octopus-chatgpt" }
octopus-config = { path = "../octopus-codex-config" }
octopus-core = { path = "../octopus-codex-core" }
octopus-features = { path = "../octopus-features" }
octopus-cxhome = { path = "../octopus-cxhome" }
octopus-login = { path = "../octopus-codex-login" }
octopus-protocol = { path = "../octopus-protocol" }
octopus-responses-api-proxy = { path = "../octopus-responses-api-proxy" }
octopus-otel = { path = "../octopus-otel" }

octopus-exec = { package = "octopus-exec-substrate", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-exec-substrate" }
octopus-sandbox-launcher = { package = "octopus-codex-sandbox-launcher", path = "../octopus-codex-sandbox-launcher" }

octopus-terminal-detection = { path = "../../../world_terminal/packages/octopus-terminal-detection" }
octopus-tui = { path = "../../../world_terminal/packages/octopus-tui" }

[dev-dependencies]
assert_matches = "1.5"
pretty_assertions = "1"
tempfile = "3"
