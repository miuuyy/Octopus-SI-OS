[package]
name = "octopus-config"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = ["fs"] }

octopus-appserver-proto = { path = "../octopus-appserver-proto" }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-execpolicy = { package = "octopus-execpolicy", path = "../octopus-execpolicy" }
octopus-features = { path = "../octopus-features" }
octopus-file-system = { package = "octopus-file-system", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-file-system" }
octopus-codex-model-provider-info = { path = "../octopus-codex-model-provider-info" }
octopus-network-proxy = { package = "octopus-network-proxy", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-network-proxy" }
octopus-protocol = { path = "../octopus-protocol" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
octopus-util-pathuri = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-pathuri" }
# The provider→terminal keymap bridge is DEAD (config divorce closed the §9.13
# residual flag): the `[tui]` section — keymap included — is typed by the terminal's
# own config surface (octopus-world-terminal-config); this crate carries the table
# opaquely and links ZERO terminal code.

base64 = "0.22.1"
dunce = "1.0.4"
futures = { version = "0.3", default-features = false, features = ["alloc", "std"] }
gethostname = "1.1.0"
indexmap = { version = "2.12.0", features = ["serde"] }
multimap = "0.10.0"
schemars = "0.8.22"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
sha2 = "0.10"
tempfile = "3.23.0"
toml = { version = "0.9.5", features = ["preserve_order"] }
toml_edit = "0.24.0"
tracing = "0.1.44"
wildmatch = "2.6.1"

[target.'cfg(unix)'.dependencies]
dns-lookup = "3.0.1"
libc = "0.2.182"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
tokio = { workspace = true, features = ["full"] }
