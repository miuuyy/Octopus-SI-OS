[package]
name = "octopus-util-image"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
base64 = "0.22.1"
image = { version = "^0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lru = "0.18.2"
sha1 = "0.10.6"
mime_guess = "2.0.5"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
divan = "0.1.21"
image = { version = "^0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[[bench]]
name = "prompt_images"
harness = false
