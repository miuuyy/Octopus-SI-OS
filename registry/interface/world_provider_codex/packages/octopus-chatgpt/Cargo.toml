[package]
name = "octopus-chatgpt"
# Codex source ported into this crate uses Rust 2024 let-chains; pin edition 2024
# explicitly (the workspace default is still 2021). This matches the established
# pattern across ported sibling crates (octopus-login, etc.).
edition = "2024"
version.workspace = true
license.workspace = true
# edition 2024 requires rust-version >= 1.85 (workspace default is 1.80).
rust-version = "1.85"

[lib]
doctest = false

[dependencies]
# Workspace-pinned primitives.
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
async-trait.workspace = true

# crates.io deps (versions + features copied from codex workspace Cargo.toml).
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["cookies", "json"] }
toml = "0.9.5"

# Ported octopus siblings (codex-* -> octopus-*; ZERO codex dep).
octopus-appserver-proto = { path = "../octopus-appserver-proto" }
octopus-core = { path = "../octopus-codex-core" }
octopus-git-utils = { package = "octopus-git-utils", path = "../../../world_terminal/packages/octopus-git-utils" }
octopus-login = { path = "../octopus-codex-login" }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
