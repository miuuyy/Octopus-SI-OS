[package]
name = "octopus-codex-cli"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_codex_cli"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.28.1", features = ["bracketed-paste", "event-stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shlex = "1.3.0"
dunce = "1.0.4"
http = "1.3.1"
os_info = "3.12.0"
owo-colors = "4.3.0"
supports-color = "3.0.2"
sys-locale = "0.3.2"
tempfile = "3.23.0"
unicode-segmentation = "1.12.0"
which = "8"
tokio = { workspace = true, features = ["io-std", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9.5"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
zstd = "0.13"

octopus-app-server-transport = { path = "../octopus-app-server-transport" }
octopus-appserver-proto = { path = "../octopus-appserver-proto" }
octopus-config = { path = "../octopus-codex-config" }
octopus-core = { path = "../octopus-codex-core" }
octopus-cxapi = { path = "../octopus-cxapi" }
octopus-exec = { package = "octopus-exec-substrate", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-exec-substrate" }
octopus-features = { path = "../octopus-features" }
octopus-identity = { path = "../octopus-codex-identity" }
octopus-install-context = { path = "../octopus-install-context" }
octopus-login = { path = "../octopus-codex-login" }
octopus-protocol = { path = "../octopus-protocol" }

octopus-arg0 = { path = "../octopus-arg0" }
octopus-git-utils = { package = "octopus-git-utils", path = "../../../world_terminal/packages/octopus-git-utils" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
octopus-utils-cli = { path = "../../../../../registry/interface/world_terminal/packages/octopus-utils-cli" }

octopus-terminal-detection = { path = "../../../world_terminal/packages/octopus-terminal-detection" }

[dev-dependencies]
insta = "1"
pretty_assertions = "1"
