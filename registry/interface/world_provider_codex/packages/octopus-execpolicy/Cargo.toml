[package]
name = "octopus-execpolicy"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Octopus exec policy: prefix-based Starlark rules for command decisions."

[lib]
name = "octopus_execpolicy"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
multimap = "0.10.0"
shlex = "1.3.0"
starlark = { version = "0.14.2", default-features = false }
octopus-util-abspath = { path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-util-abspath" }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
