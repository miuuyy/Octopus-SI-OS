[package]
name = "octopus-arg0"
version.workspace = true
# Ported Codex source uses edition 2024 idioms (let-chains); override workspace 2021.
edition = "2024"
license.workspace = true
# edition 2024 requires rustc >= 1.85 (override workspace 1.80).
rust-version = "1.85"

[lib]
name = "octopus_arg0"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
octopus-applypatch = { package = "octopus-applypatch", path = "../../../../../registry/worker_environment_kind/filesystem_workspace/packages/octopus-applypatch" }
# arg0 is the box arg0-trick DISPATCH composition (consumed only by the product-binary fronts cli /
# tui, which already link exec directly). It no longer code-depends on the sandbox substrate: the
# one string it read (the `codex-linux-sandbox` dispatch basename) is inlined as arg0's own
# product-binary contract (codex-cut-map §9.14). It reaches the box unsandboxed LOCAL_FS (for the
# apply-patch dispatch) from octopus-file-system. The exec dep is the arg0->WEK-helper composition:
# the exec-server substrate now lives in the WEK code-world; arg0 dispatches into its fs-helper
# entry-point (run_fs_helper_main / CODEX_FS_HELPER_ARG1) as a product binary composing a room helper.
octopus-exec = { package = "octopus-exec-substrate", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-exec-substrate" }
octopus-file-system = { package = "octopus-file-system", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-file-system" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
dirs = "6"
dotenvy = "0.15.7"
tempfile = "3.23.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

# The execve-wrapper dispatch target: when a sandboxed shell exec's the `codex-execve-wrapper`
# alias (the symlink arg0 plants on PATH), the product binary re-enters here and must run the
# escalation wrapper client. Box->box edge — the wrapper is arg0's alias-binary arm, like
# octopus-applypatch.
[target.'cfg(unix)'.dependencies]
octopus-shell-escalation = { package = "octopus-shell-escalation", path = "../octopus-shell-escalation" }
