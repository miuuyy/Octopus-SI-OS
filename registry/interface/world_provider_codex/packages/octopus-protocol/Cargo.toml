[package]
name = "octopus-protocol"
# Ported Codex source uses let-chains -> requires edition 2024 (override workspace 2021).
edition = "2024"
rust-version = "1.85"
version.workspace = true
license.workspace = true

[lib]
name = "octopus_protocol"
path = "src/lib.rs"
doctest = false

[dependencies]
# Substrate contract carved out into a BOX crate (crates/octopus-substrate-contract).
# The provider protocol re-exports its types at the original public paths so
# provider code keeps compiling unchanged; the model-wire vocabulary stays here.
octopus-substrate-contract = { package = "octopus-substrate-contract", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-substrate-contract" }
# Ported siblings (codex-* -> octopus-*)
octopus-async-utils = { path = "../octopus-async-utils" }
octopus-execpolicy = { package = "octopus-execpolicy", path = "../octopus-execpolicy" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
octopus-util-image = { path = "../octopus-util-image" }
octopus-util-pathuri = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-pathuri" }
octopus-util-string = { path = "../octopus-util-string" }

# Workspace primitives
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true

# crates.io deps (versions copied from codex-rs workspace)
chardetng = "0.1.17"
chrono = { version = "0.4.43", features = ["serde"] }
encoding_rs = "0.8.35"
globset = "0.4"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
quick-xml = { version = "0.38.4", features = ["serialize"] }
reqwest = { version = "0.12", features = ["cookies"] }
schemars = "0.8.22"
serde_with = { version = "3.17", features = ["macros", "base64"] }
strum = "0.27.2"
strum_macros = "0.28.0"
sys-locale = "0.3.2"
tracing = "0.1"
ts-rs = { version = "11", features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }
uuid = { version = "1", features = ["serde", "v7", "v4"] }
wildmatch = "2.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
seccompiler = "0.5.0"

[dev-dependencies]
http = "1.3.1"
pretty_assertions = "1.4.1"
tempfile = "3.23.0"

[package.metadata.cargo-shear]
ignored = ["icu_provider", "strum"]
