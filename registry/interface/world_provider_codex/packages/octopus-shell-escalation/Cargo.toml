[package]
name = "octopus-shell-escalation"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
octopus-substrate-contract = { path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-substrate-contract" }
octopus-util-abspath = { path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-util-abspath" }
libc = "0.2.182"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
socket2 = { version = "0.6.1", features = ["all"] }
tokio = { workspace = true, features = [
    "io-std",
    "net",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-util.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"

[lib]
doctest = false
