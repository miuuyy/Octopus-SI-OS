[package]
name = "octopus-core"
# NOTE(consolidate): Octopus workspace pins edition=2021, but this crate is a
# machine port of codex-rs which uses edition 2024 (let-chains, etc.). Override
# locally so the ported source compiles. TODO(consolidate): lift workspace to 2024.
edition = "2024"
version.workspace = true
license.workspace = true
# edition 2024 requires rust-version >= 1.85; workspace pins 1.80, so override here.
rust-version = "1.85"

[lib]
name = "octopus_core"
path = "src/lib.rs"

[[bin]]
name = "octopus-write-config-schema"
path = "src/bin/config_schema.rs"

[dependencies]
# crates.io (versions + features copied from codex-rs workspace.dependencies)
anyhow.workspace = true
arc-swap = "1.9.0"
async-channel = "2.3.1"
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dunce = "1.0.4"
indexmap = "2.12.0"
libc = "0.2.182"
lru = "0.16.3"
once_cell = "1.20.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha1 = "0.10.6"
shlex = "1.3.0"
similar = "2.7.0"
tempfile = "3.23.0"
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
toml = "0.9.5"
toml_edit = "0.24.0"
tracing = { version = "0.1.44", features = ["log"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
which = "8"

# Ported octopus sibling crates (mapped from codex-* deps that ARE ported).
# HYGIENE (2026-06-22, post engine-island deletion): trimmed to only the sibling
# crates the surviving engine-free surface (config/otel/mcp-manager/sandbox/
# personality/exec-policy/connectors/state_db_bridge/models_manager_build/...)
# actually imports. The dissolved-spine deps (octopus-{ee,descriptors,interfaces,
# runtime,web-search,memories,skills,tools,cxapi,prompts,context,...}) and other
# engine-only siblings were imported ONLY by the deleted Codex engine island, so
# they were removed (verified by grep + `cargo check -p octopus-core`). The old
# "re-rooting seam" comments described that deleted per-turn choke and are gone.
octopus-appserver-proto = { path = "../octopus-appserver-proto" }
octopus-config = { path = "../octopus-codex-config" }
octopus-cxhome = { path = "../octopus-cxhome" }
octopus-features = { path = "../octopus-features" }
octopus-login = { path = "../octopus-codex-login" }
octopus-codex-model-provider-info = { path = "../octopus-codex-model-provider-info" }
octopus-otel = { path = "../octopus-otel" }
octopus-shell-command = { package = "octopus-shell-command", path = "../../../world_terminal/packages/octopus-shell-command" }
octopus-execpolicy = { package = "octopus-execpolicy", path = "../octopus-execpolicy" }
octopus-git-utils = { package = "octopus-git-utils", path = "../../../world_terminal/packages/octopus-git-utils" }
octopus-install-context = { path = "../octopus-install-context" }
octopus-network-proxy = { package = "octopus-network-proxy", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-network-proxy" }
octopus-file-system = { package = "octopus-file-system", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-file-system" }
octopus-protocol = { path = "../octopus-protocol" }
octopus-utils-home-dir = { path = "../../../../../registry/interface/world_terminal/packages/octopus-utils-home-dir" }
octopus-utils-path = { path = "../../../world_terminal/packages/octopus-utils-path" }
octopus-util-abspath = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-abspath" }
octopus-util-pty = { package = "octopus-util-pty", path = "../../../../../registry/worker_environment_kind/process_session/packages/octopus-util-pty" }
octopus-util-pathuri = { path = "../../../../worker_environment_kind/process_session/packages/octopus-util-pathuri" }


[dev-dependencies]
assert_matches = "1.5"
# The /debug-config report suite moved here WITH its renderer (codex-cut-map §9.29(7)
# conduction); the two report snapshots carry the exact text they pinned in the terminal crate.
insta = "1"
maplit = "1.0.2"
pretty_assertions = "1.4.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { version = "*", features = ["vendored"] }

[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { version = "*", features = ["vendored"] }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
