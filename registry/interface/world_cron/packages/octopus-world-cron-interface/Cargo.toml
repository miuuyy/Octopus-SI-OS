[package]
name = "octopus-world-cron-interface"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
octopus-operator-chat-client = { path = "../../../world_operator_chat/packages/octopus-operator-chat-client" }
serde_json.workspace = true

[[bin]]
name = "octopus-world-cron-task-plan"
path = "src/bin/octopus-world-cron-task-plan.rs"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util.workspace = true
octopus-app-server = { path = "../../../../../crates/octopus-app-server" }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-interface-transport = { path = "../../../../../crates/octopus-interface-transport" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-ledger-store = { path = "../../../../../crates/octopus-ledger-store" }
octopus-runtime = { path = "../../../../../crates/octopus-runtime" }
octopus-run-record = { path = "../../../../../crates/octopus-run-record" }

[lints.rust]
unsafe_code = "forbid"
