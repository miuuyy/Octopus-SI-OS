[package]
name = "octopus-exec-substrate"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "octopus_exec"
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["io", "rt"] }
arc-swap = "1.9.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
clatter = { version = "2.2.0", default-features = false, features = [
    "alloc",
    "getrandom",
    "use-25519",
    "use-aes-gcm",
    "use-rust-crypto-ml-kem",
    "use-sha",
] }
futures = { version = "0.3", default-features = false }
http = "1.3.1"
hmac = "0.12.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10.9"
prost = "0.14.3"
toml = "0.9.5"
tokio-tungstenite = { version = "0.28.0", features = [
    "rustls-tls-native-roots",
] }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8.2"
octopus-substrate-contract = { path = "../octopus-substrate-contract" }
octopus-file-system = { path = "../octopus-file-system" }
octopus-sandbox-substrate = { path = "../octopus-sandbox-substrate" }
octopus-util-pty = { path = "../octopus-util-pty" }
octopus-util-abspath = { path = "../octopus-util-abspath" }
octopus-util-pathuri = { path = "../octopus-util-pathuri" }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"
