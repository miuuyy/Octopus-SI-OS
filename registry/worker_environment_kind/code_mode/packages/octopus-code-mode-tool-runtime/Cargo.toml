[package]
name = "octopus-code-mode-tool-runtime"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[[bin]]
name = "octopus-code-mode-tool-door-life"
path = "src/bin/tool_door_life.rs"

[dependencies]
octopus-code-mode-room = { path = "../octopus-code-mode-room" }
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util", "time", "process"] }
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-tool-door-runtime = { package = "octopus-process-session-tool-runtime", path = "../../../process_session/packages/octopus-process-session-tool-runtime" }

octopus-run-authoring = { path = "../../../../interface/system_interface_authoring/packages/octopus-run-authoring" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-run-record = { path = "../../../../../crates/octopus-run-record" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
