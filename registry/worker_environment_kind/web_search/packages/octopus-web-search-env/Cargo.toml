[package]
name = "octopus-web-search-env"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "octopus_web_search_env"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
blake3 = "1"
percent-encoding = "2"

octopus-browser-session-env = { path = "../../../browser_session/packages/octopus-browser-session-env" }
octopus-tool-door-runtime = { package = "octopus-process-session-tool-runtime", path = "../../../process_session/packages/octopus-process-session-tool-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }

[dev-dependencies]
octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }
tempfile = "3"
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
