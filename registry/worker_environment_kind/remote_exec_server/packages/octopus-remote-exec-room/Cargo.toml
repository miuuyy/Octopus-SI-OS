[package]
name = "octopus-remote-exec-room"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
url = "2"

octopus-descriptors = { path = "../../../../../crates/octopus-descriptors" }
octopus-exec = { package = "octopus-exec-substrate", path = "../../../process_session/packages/octopus-exec-substrate" }
octopus-tool-door-runtime = { package = "octopus-process-session-tool-runtime", path = "../../../process_session/packages/octopus-process-session-tool-runtime" }
octopus-interfaces = { path = "../../../../../crates/octopus-interfaces" }
octopus-substrate-contract = { path = "../../../process_session/packages/octopus-substrate-contract" }
octopus-tool-handlers = { path = "../../../../../crates/octopus-tool-handlers" }
octopus-util-pathuri = { path = "../../../process_session/packages/octopus-util-pathuri" }
octopus-worker-env = { path = "../../../../../crates/octopus-worker-env" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[dev-dependencies]
octopus-ledger = { path = "../../../../../crates/octopus-ledger" }
octopus-tool-registry = { path = "../../../../../crates/octopus-tool-registry" }
tempfile = "3"
