[workspace]
resolver = "2"
members = [
    "crates/*",
    "registry/interface/*/packages/*",
    "registry/worker_environment_kind/*/packages/*",
]
# Managed provider executables are distribution inputs, not Rust packages.
exclude = [
    "registry/interface/world_provider_codex/packages/bin",
    "registry/interface/world_provider_claude_native/packages/octopus-claude-sdk-child",
]
[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.91"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "=4.2.0"
schemars = "0.8"
blake3 = "1"
thiserror = "1"
ed25519-dalek = "2"
tokio = { version = "1", features = ["sync","rt","rt-multi-thread","macros","time","process","io-util","io-std","fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
anyhow = "1"
notify = "8.2"
[workspace.lints]
[profile.dev]
incremental = false
debug = 0

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.jsonschema]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.test]
incremental = false
debug = 0
