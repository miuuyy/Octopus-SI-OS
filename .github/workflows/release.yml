name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select native build toolchain (Swift 6.2+)
        run: |
          swift_ok() {
            local dev_dir="${1:-}"
            local ver
            if [ -n "$dev_dir" ]; then
              ver="$(DEVELOPER_DIR="$dev_dir" xcrun swift --version 2>/dev/null | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p' | head -n1)"
            else
              ver="$(xcrun swift --version 2>/dev/null | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p' | head -n1)"
            fi
            [ -n "$ver" ] && awk -v v="$ver" 'BEGIN { split(v, a, "."); maj=a[1]+0; min=a[2]+0; exit !((maj > 6) || (maj == 6 && min >= 2)) }'
          }
          if ! swift_ok ""; then
            selected=""
            for candidate in $(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -Vr || true); do
              dev="$candidate/Contents/Developer"
              [ -d "$dev" ] || continue
              if swift_ok "$dev"; then
                selected="$dev"
                break
              fi
            done
            if [ -z "$selected" ]; then
              echo "No Xcode toolchain with Swift >= 6.2 found under /Applications" >&2
              exit 1
            fi
            echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
            echo "Selected DEVELOPER_DIR=$selected"
          fi

      - name: Verify the native build toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./app/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/package.json ($expected)" >&2
            exit 1
          fi

      - name: Install client dependencies
        run: npm ci --prefix app

      - name: Fetch pinned Node headers and Electron
        run: |
          headers="$(node app/native/runtime.cjs headers)"
          echo "OCTOPUS_NATIVE_NODE_HEADERS=$headers" >> "$GITHUB_ENV"
          node app/native/runtime.cjs electron

      - name: Package Octopus.app
        env:
          CARGO_INCREMENTAL: "0"
        run: npm --prefix app run package:mac

      - name: Build and verify the disk image
        run: node app/scripts/release-macos.cjs

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: octopus-macos
          path: |
            app/build/release/
            app/build/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libssl-dev libsqlite3-dev libasound2-dev

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./app/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/package.json ($expected)" >&2
            exit 1
          fi

      - name: Install client dependencies without native rebuild
        run: npm ci --prefix app --ignore-scripts

      - name: Build Linux headless CLI runtime
        env:
          CARGO_INCREMENTAL: "0"
        run: node app/scripts/build-cli.cjs --runtime --target=x86_64-unknown-linux-gnu

      - name: Package and verify Linux headless tarball
        run: node app/scripts/release-linux.cjs

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-x64
          path: app/build/release-linux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [macos, linux-headless]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: octopus-macos
          path: release-assets/macos

      - name: Download Linux headless release assets
        uses: actions/download-artifact@v4
        with:
          name: octopus-linux-x64
          path: release-assets/linux

      - name: Assemble and verify per-platform checksums
        run: |
          set -eu
          (cd release-assets/macos/release && sha256sum -c checksums.txt)
          (cd release-assets/linux && sha256sum -c checksums.txt && sha256sum -c Octopus-*-linux-*.tar.gz.sha256)
          mkdir -p release-assets/release
          for file in release-assets/macos/release/* release-assets/linux/*; do
            base="$(basename "$file")"
            [ "$base" = checksums.txt ] && continue
            if [ -e "release-assets/release/$base" ]; then
              echo "Duplicate release asset name: $base" >&2
              exit 1
            fi
            cp -p "$file" "release-assets/release/$base"
          done
          cat release-assets/macos/release/checksums.txt release-assets/linux/checksums.txt \
            | LC_ALL=C sort -k2,2 > release-assets/release/checksums.txt
          cp -p release-assets/macos/release-notes.md release-assets/release-notes.md

      - name: Verify checksums
        working-directory: release-assets/release
        run: |
          test -s checksums.txt
          test -s install.sh
          test -s install-linux.sh
          sh -n install.sh
          sh -n install-linux.sh
          sha256sum -c checksums.txt
          for file in *; do
            [ "$file" = checksums.txt ] && continue
            awk -v asset="$file" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt \
              || { echo "checksums.txt has no entry for $file" >&2; exit 1; }
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; delete it or publish a new tag" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Octopus ${GITHUB_REF_NAME#v}" \
            --notes-file release-assets/release-notes.md \
            --verify-tag \
            --draft

      - name: Verify uploaded asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-assets/release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv' > uploaded.tsv
          test "$(wc -l < uploaded.tsv)" -eq "$(ls -1 | grep -vc '^uploaded.tsv$')"
          while IFS="$(printf '\t')" read -r name digest; do
            if [ "$name" = checksums.txt ]; then
              expected="$(sha256sum checksums.txt | awk '{ print $1 }')"
            else
              expected="$(awk -v asset="$name" '$2 == asset { print $1 }' checksums.txt)"
            fi
            if [ -z "$expected" ] || [ "$digest" != "sha256:$expected" ]; then
              echo "Uploaded asset $name does not match its checksum" >&2
              exit 1
            fi
          done < uploaded.tsv
