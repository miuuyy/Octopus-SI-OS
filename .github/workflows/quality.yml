name: quality

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install client dependencies without native rebuild
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Client source and contract checks
        working-directory: app
        run: |
          npx tsc --noEmit --incremental false
          npm run check:design-system
          npm run test:chat-trace-contracts
          npm run test:chat-composer-contracts
          npm run test:agent-templates
          npm run test:files-contracts
          npm run test:workspace-setup
          node scripts/test-home-experience.cjs
          node scripts/test-home-voice-contracts.cjs
          node --test scripts/test-dashboard-presentation.cjs scripts/test-topology-performance.cjs
          node scripts/test-task-environment-summary.cjs
          node scripts/test-client-turn-queue.cjs
          node scripts/test-client-artifact-delivery.cjs
          node scripts/test-command-delivery.cjs
          node scripts/test-steering-input-receipts.cjs
          node scripts/test-chat-receipt-state.cjs
          node scripts/test-chat-message-projection.cjs
          node scripts/test-chat-message-list.cjs
          node scripts/test-chat-workspace.cjs
          node scripts/test-message-tooltip.cjs
          node scripts/test-chat-thread-header.cjs
          node scripts/test-client-agents.cjs
          node scripts/test-subagent-activity.cjs
          node scripts/test-task-summary.cjs
          node scripts/test-electron-main.cjs
          node scripts/test-dev-server.cjs
          node scripts/test-client-boot.cjs
          node scripts/test-chat-view.cjs
          node scripts/test-client-launch.cjs
          node scripts/test-home-view.cjs
          node scripts/test-composer-dictation.cjs
          node scripts/test-application-repair.cjs
          node scripts/test-chat-provider-catalog.cjs
          node scripts/test-composer-agent-controls.cjs
          node scripts/test-chat-surfaces.cjs
          node scripts/test-operator-shell.cjs
          node scripts/test-sidebar.cjs
          node scripts/test-stylesheet-contracts.cjs
          node scripts/test-browser-surface.cjs
          node scripts/test-resume-glyph-parity.cjs
          node scripts/test-client-catalog-cycle.cjs
          node scripts/test-shell-pane-chrome.cjs
          node scripts/test-command-activity.cjs

      - name: Client package and lifecycle contracts
        working-directory: app
        run: |
          node scripts/test-local-packages.cjs --consent-recipe
          node scripts/test-client-extensions.cjs
          node scripts/test-client-extension-authoring.cjs

      - name: Client interaction and file contracts
        working-directory: app
        run: |
          node scripts/test-client-navigation.cjs
          node scripts/test-client-context-menu.cjs
          node scripts/test-client-interface-contracts.cjs
          node scripts/test-client-window-close.cjs
          node scripts/test-model-picker.cjs
          node scripts/test-model-picker-dom.mjs
          node scripts/test-agent-selection.cjs
          node scripts/test-files-engine.cjs
          node scripts/test-files-lifecycle.cjs
          node scripts/test-mark-activity.cjs
          node scripts/test-client-actions.cjs
          node scripts/test-projection-invalidation.cjs
          node scripts/test-air-hand-swipe.cjs
          node scripts/test-scheduled-ui.cjs
          node scripts/test-markdown-presentation.mjs

      - name: Interface package source contracts
        run: |
          node registry/interface/world_operator_chat/test_client_outbound.cjs
          node registry/interface/world_operator_chat/test_planned_artifact_write.cjs
          node registry/interface/world_operator_chat/test_publication.cjs
          node registry/interface/world_operator_chat/test_home_state.cjs
          node registry/interface/world_operator_chat/test_maintenance_client.cjs
          python3 registry/verifier/tool_result_correspondence/tests/test_verify.py
          python3 registry/verifier/pre_tool_use_guard/tests/test_verify.py
          python3 registry/interface/world_slack/tests/test_slack_contract.py
          node registry/worker_environment_kind/desktop_session/packages/octopus-system-gui-env/native/configure-transport.test.cjs
          node registry/worker_environment_kind/browser_session/packages/octopus-browser-session-env/native/setup-host.test.cjs
          node registry/worker_environment_kind/browser_session/packages/octopus-browser-session-env/native/tests/engine-mode.test.cjs
          node registry/worker_environment_kind/browser_session/packages/octopus-browser-session-env/native/tests/standard-history.test.cjs

      - name: Public source boundary
        run: node app/scripts/check-public-source.cjs

  workspace-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev

      - name: Compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace check (fail-closed, no degraded compile)
        run: cargo check --workspace --all-targets --keep-going

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev

      - name: Compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install test runner
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Policy, ledger proof, runtime checkpoint, Home binding and file publication contracts
        run: |
          cargo nextest run --locked -p octopus-policy -p octopus-ledger-index -p octopus-runtime -p octopus-operator-chat-client -p octopus-model-context-render -p octopus-file-storage --lib --test instructions -E 'package(octopus-policy) | package(octopus-ledger-index) | package(octopus-runtime) | binary(instructions) | (package(octopus-operator-chat-client) & test(real_registry_home_plan_exports_authoring_and_exact_policy_requirements)) | (package(octopus-file-storage) & test(/^publication::tests::/))'

  native-client:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      OCTOPUS_NATIVE_NODE_HEADERS: ${{ github.workspace }}/app/build/node-v24.15.0/include/node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install client dependencies without native rebuild
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Prepare pinned client native headers
        run: |
          mkdir -p app/build
          curl -fL https://nodejs.org/download/release/v24.15.0/node-v24.15.0-headers.tar.gz -o app/build/node-v24.15.0-headers.tar.gz
          printf '%s  %s\n' 9a9250039fef572d0bcc110ac5e78055faf5604421211d2d5f578ebc5a34e703 app/build/node-v24.15.0-headers.tar.gz | shasum -a 256 -c -
          tar -xzf app/build/node-v24.15.0-headers.tar.gz -C app/build

      - name: Build the client filesystem module
        run: node app/native/build.cjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache the pinned managed provider executable
        uses: actions/cache@v4
        with:
          path: registry/interface/world_provider_codex/packages/bin
          key: managed-codex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('registry/interface/world_provider_codex/packages/octopus-provider-codex/managed-cli/release.json', 'registry/interface/world_provider_codex/packages/octopus-provider-codex/managed-cli/bootstrap.cjs') }}

      - name: Build the topology planner and input intake life
        run: cargo build --locked -p octopus-operator-chat-client --bin octopus-operator-chat-topology -p octopus-provider-codex --bin octopus-input-intake-life

      - name: Prepare the declared managed provider executable
        run: node registry/interface/world_provider_codex/packages/octopus-provider-codex/managed-cli/bootstrap.cjs materialize --destination "$PWD/registry/interface/world_provider_codex/packages/bin"

      - name: Local package lifecycle and fresh Home setup through the real topology planner
        run: |
          mkdir -p registry/interface/world_provider_codex/packages/octopus-provider-codex/intake/life-bin
          install -m 755 target/debug/octopus-input-intake-life registry/interface/world_provider_codex/packages/octopus-provider-codex/intake/life-bin/octopus-input-intake-life
          node app/scripts/test-local-packages.cjs
          node app/scripts/test-local-package-closure.cjs --topology-binary target/debug/octopus-operator-chat-topology
          node app/scripts/test-local-package-closure.cjs --bounded-agent-preset target/debug/octopus-operator-chat-topology

      - name: Client setup and terminal contracts
        run: |
          node app/scripts/test-client-setup.cjs
          npm --prefix app run test:cli

  native-contracts:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      OCTOPUS_NATIVE_NODE_HEADERS: ${{ github.workspace }}/app/build/node-v24.15.0/include/node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install client dependencies without native rebuild
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Prepare pinned client native headers
        run: |
          mkdir -p app/build
          curl -fL https://nodejs.org/download/release/v24.15.0/node-v24.15.0-headers.tar.gz -o app/build/node-v24.15.0-headers.tar.gz
          printf '%s  %s\n' 9a9250039fef572d0bcc110ac5e78055faf5604421211d2d5f578ebc5a34e703 app/build/node-v24.15.0-headers.tar.gz | shasum -a 256 -c -
          tar -xzf app/build/node-v24.15.0-headers.tar.gz -C app/build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install test runner
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install declared OCR verifier executable
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tesseract

      - name: Package verifier, Home admission, provider recovery and voice contracts
        run: |
          cargo nextest run --locked -p octopus-app-server -p octopus-operator-chat-client -p octopus-run-authoring -p octopus-provider-codex -p octopus-realtime-signaling --lib --test worker_interface_cross_run_fan_out --test conditioned_publication --test run_composition --test checked_input_writers -E 'not binary(run_composition) | test(input_revision_cli_preserves_payload_intent_and_requires_checked_writer_results)'

  tool-continuations:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install test runner
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Tool receipt and Code Mode continuation contracts
        run: |
          cargo nextest run --locked -p octopus-process-session-tool-runtime -p octopus-code-mode-room --lib
